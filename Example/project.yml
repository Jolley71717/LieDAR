# xcodegen spec for the LieDAR example app.
#
# The generated Example.xcodeproj is COMMITTED: CI runners have no xcodegen, and a clean clone
# must build the app and run the journeys with no generation step. Regenerate after changing this
# file with `xcodegen generate --spec Example/project.yml` and commit the result.
name: Example
options:
  bundleIdPrefix: com.jolleytech.liedar.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.38.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Simulator-only project: no team, no profile, nothing for CI to sign.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  # The package under test, by relative path, never a remote URL. Example/ lives inside it.
  LieDAR:
    path: ..
targets:
  ExampleApp:
    type: application
    platform: iOS
    sources:
      - path: ExampleApp
    dependencies:
      - package: LieDAR
        product: LieDAR
    info:
      path: ExampleApp/Info.plist
      properties:
        CFBundleDisplayName: LieDAR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jolleytech.liedar.example
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  ExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExampleUITests
    dependencies:
      - target: ExampleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jolleytech.liedar.example.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ExampleApp
schemes:
  ExampleApp:
    build:
      targets:
        ExampleApp: all
        ExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ExampleUITests
